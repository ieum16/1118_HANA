<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일 작성기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY</p>
      <h1>오늘 할 일</h1>
      <p id="remaining" class="remaining" aria-live="polite">남은 할 일 0개</p>
    </header>

    <form id="todo-form" novalidate>
      <label for="todo-input" class="sr-only">새 할 일</label>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          maxlength="100"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
          autofocus
        >
        <button type="submit" class="add-button">추가</button>
      </div>
      <p id="input-error" class="error" role="alert" aria-live="assertive"></p>
    </form>

    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty-message" class="empty-message">할 일을 추가해 보세요.</p>

    <section class="fx" aria-labelledby="fx-title">
      <p class="eyebrow">EXCHANGE</p>
      <h2 id="fx-title">환율 계산기</h2>

      <div class="fx-grid">
        <label for="fx-currency">통화</label>
        <select id="fx-currency">
          <option value="USD">USD 미국 달러</option>
          <option value="JPY">JPY 일본 엔 (100엔)</option>
          <option value="EUR">EUR 유로</option>
        </select>

        <label for="fx-rate">기준환율 <span id="fx-unit" class="unit">(1 USD당 원)</span></label>
        <input id="fx-rate" type="text" inputmode="decimal" autocomplete="off" placeholder="은행 화면의 매매기준율">

        <label for="fx-amount">외화 금액</label>
        <input id="fx-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 100">

        <label for="fx-spread">스프레드 %</label>
        <input id="fx-spread" type="text" inputmode="decimal" autocomplete="off" placeholder="비워도 돼요">

        <label for="fx-pref">우대율 %</label>
        <input id="fx-pref" type="text" inputmode="decimal" autocomplete="off" placeholder="비워도 돼요">
      </div>

      <dl class="fx-result" aria-live="polite">
        <div><dt>원화 환산 (기준)</dt><dd id="fx-base">-</dd></div>
        <div><dt>살 때</dt><dd id="fx-buy">-</dd></div>
        <div><dt>팔 때</dt><dd id="fx-sell">-</dd></div>
      </dl>
      <p id="fx-error" class="error" role="alert"></p>

      <details class="fx-paste">
        <summary>은행 환율표 붙여넣기</summary>
        <label for="fx-paste-input" class="sr-only">은행 환율표</label>
        <textarea id="fx-paste-input" rows="4" placeholder="은행 환율표를 복사해 여기에 붙여 넣으세요"></textarea>
        <button type="button" id="fx-paste-button" class="sub-button">통화별로 채우기</button>
      </details>

      <button type="button" id="fx-load" class="sub-button">오늘 환율 불러오기</button>
      <p id="fx-source" class="fx-source">기준환율은 은행 고시가 정답이에요.</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
