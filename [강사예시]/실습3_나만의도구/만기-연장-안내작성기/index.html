<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>만기 연장 안내 작성기</title>
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --ink: #17213a;
    --muted: #5f6b85;
    --line: #dce2ee;
    --accent: #1f3a8a;
    --accent-soft: #e6ecfa;
    --warn: #b42318;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--bg); }
  .wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 18px; }
  header p { margin: 0 0 4px; color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .14em; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -0.03em; }
  header p.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; font-weight: 500; letter-spacing: normal; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; min-width: 0; }
  .card h2 { margin: 0 0 14px; font-size: 18px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label, legend { font-size: 14px; font-weight: 800; padding: 0; }
  .hint { color: var(--muted); font-weight: 600; font-size: 12px; }
  input[type="text"], input[type="date"], select {
    width: 100%; min-width: 0; padding: 11px 13px; font: inherit; font-size: 16px;
    border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 12px; padding: 4px; margin-top: 6px; }
  .seg input { position: absolute; opacity: 0; }
  .seg label { text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--muted); }
  .seg input:checked + label { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgb(0 0 0 / 10%); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .error { min-height: 20px; margin: 0; color: var(--warn); font-weight: 700; font-size: 14px; }
  .docs-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px; }
  .docs-head strong { font-size: 15px; }
  .count { color: var(--accent); font-weight: 800; }
  ol.docs { margin: 0 0 16px; padding-left: 22px; line-height: 1.7; }
  .notice { background: var(--accent-soft); border-radius: 14px; padding: 16px; }
  .msg { margin: 0 0 12px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  button.copy { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; }
  button.copy:hover { filter: brightness(1.12); }
  button.copy:disabled { background: #a7b0c4; cursor: not-allowed; }
  .foot { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
  @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>LOAN · MATURITY</p>
    <h1>만기 연장 안내 작성기</h1>
    <p class="sub">고객 유형 · 회사명 · 만기일을 넣으면 필요 서류가 들어간 연장 안내 문장이 완성됩니다. 복사해서 메신저에 붙여 넣으세요.</p>
  </header>

  <div class="grid">
    <section class="card" aria-labelledby="in-title">
      <h2 id="in-title">입력</h2>

      <fieldset>
        <legend>고객 유형</legend>
        <div class="seg">
          <input type="radio" name="ctype" id="ctype-corp" value="corp" checked><label for="ctype-corp">법인</label>
          <input type="radio" name="ctype" id="ctype-sole" value="sole"><label for="ctype-sole">개인사업자</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="company">회사명 <span class="hint">가짜 이름으로 연습해요</span></label>
        <input id="company" type="text" autocomplete="off" value="(주)한빛정밀">
      </div>

      <div class="field">
        <label for="loan">대출 종류</label>
        <select id="loan">
          <option value="운전자금" selected>운전자금</option>
          <option value="시설자금">시설자금</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label for="maturity">대출 만기일</label>
          <input id="maturity" type="date">
        </div>
        <div class="field">
          <label for="due">서류 회신 기한</label>
          <input id="due" type="date">
        </div>
      </div>

      <div class="field">
        <label for="rm">담당자 이름 <span class="hint">비워도 돼요</span></label>
        <input id="rm" type="text" autocomplete="off" value="연습요정">
      </div>

      <p id="error" class="error" role="alert"></p>
    </section>

    <section class="card" aria-labelledby="out-title" aria-live="polite">
      <h2 id="out-title">결과</h2>
      <div class="docs-head">
        <strong>필요 서류</strong>
        <span class="count" id="count">-</span>
      </div>
      <ol class="docs" id="docs"></ol>

      <div class="notice">
        <p class="msg" id="message">입력값을 넣으면 안내 문장이 만들어집니다.</p>
        <button type="button" class="copy" id="copy" disabled>안내 문장 복사</button>
      </div>
    </section>
  </div>

  <p class="foot">가짜 회사명과 날짜로 연습하는 작성기입니다. 입력한 내용은 이 브라우저 밖으로 보내지 않고, 저장하지도 않습니다. 메신저로 보내는 것은 직접 해 주세요. 서류 목록은 연습용 예시이며, 실제 필요 서류와 연장 조건은 은행 내규와 시스템 기준을 따릅니다.</p>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // 연습용 예시 서류 목록 (실제는 은행 내규 기준)
  const DOCS = {
    corp: [
      "사업자등록증 사본",
      "법인 등기사항전부증명서 (최근 3개월 이내 발급)",
      "최근 3개년 재무제표 (결산 기준)",
      "부가가치세 과세표준증명원 (최근 1년)",
      "법인 인감증명서 (최근 3개월 이내 발급)",
    ],
    sole: [
      "사업자등록증 사본",
      "소득금액증명원 (최근 2년)",
      "부가가치세 과세표준증명원 (최근 1년)",
      "대표자 신분증 (방문하실 때 지참)",
    ],
  };
  const FACILITY_EXTRA = "담보 물건 등기사항전부증명서 (최근 3개월 이내 발급)";
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];

  function docsFor(ctype, loan) {
    const list = [...DOCS[ctype]];
    if (loan === "시설자금") list.push(FACILITY_EXTRA);
    return list;
  }

  // "2027-01-15" → Date (그 날 0시, 내 컴퓨터 시간 기준)
  function parseDate(text) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return null;
    const [y, m, d] = text.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return date.getMonth() === m - 1 ? date : null;
  }
  const toInput = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmtDate = (d) => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일(${WEEK[d.getDay()]})`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  function today() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

  // 전화번호 · 계좌 · 주민번호처럼 보이는 숫자 (하이픈 · 띄어쓰기 빼고 6자리 이상)
  const looksLikeRealNumber = (text) => /\d{6,}/.test(text.replace(/[-\s.]/g, ""));

  function buildMessage({ company, loan, maturity, due, rm, docs }) {
    const lines = [
      `안녕하세요, ${company} 대표님. 담당 RM${rm ? " " + rm : ""}입니다.`,
      `${company}의 ${loan} 대출 만기일이 ${fmtDate(maturity)}이라 기한 연장 안내드립니다.`,
      `연장 검토를 위해 아래 서류 ${docs.length}가지를 ${fmtDate(due)}까지 보내 주시면 됩니다.`,
      "",
      ...docs.map((doc, i) => `${i + 1}. ${doc}`),
      "",
      "서류 준비하시다가 궁금한 점은 편하게 연락 주세요. 감사합니다.",
      "※ 연장 여부와 조건은 심사 후 정해지며, 필요 서류는 은행 기준에 따라 달라질 수 있습니다.",
    ];
    return lines.join("\n");
  }

  function showDocs(docs) {
    $("docs").replaceChildren(...docs.map((doc) => {
      const li = document.createElement("li");
      li.textContent = doc;
      return li;
    }));
    $("count").textContent = `${docs.length}가지`;
  }

  function stop(msg) {
    $("message").textContent = "입력값을 넣으면 안내 문장이 만들어집니다.";
    $("copy").disabled = true;
    $("error").textContent = msg;
  }

  function update() {
    const ctype = document.querySelector('input[name="ctype"]:checked').value;
    const loan = $("loan").value;
    const company = $("company").value.trim();
    const rm = $("rm").value.trim();
    const docs = docsFor(ctype, loan);
    showDocs(docs);

    if (company === "") return stop("회사명을 넣어 주세요. (가짜 이름으로 연습해요)");
    if (company.length > 30) return stop("회사명은 30자 이내로 넣어 주세요.");
    if (looksLikeRealNumber(company) || looksLikeRealNumber(rm)) return stop("전화번호 · 계좌번호 같은 실제 번호는 넣지 말아 주세요.");
    if (rm.length > 10) return stop("담당자 이름은 10자 이내로 넣어 주세요.");

    const maturity = parseDate($("maturity").value);
    const due = parseDate($("due").value);
    if (!maturity) return stop("대출 만기일을 골라 주세요.");
    if (maturity < today()) return stop("만기일이 이미 지났어요. 날짜를 확인해 주세요.");
    if (!due) return stop("서류 회신 기한을 골라 주세요.");
    if (due >= maturity) return stop("서류 회신 기한은 만기일보다 앞이어야 해요.");
    if (due < today()) return stop("서류 회신 기한이 이미 지났어요. 오늘 이후로 골라 주세요.");

    $("error").textContent = "";
    $("message").textContent = buildMessage({ company, loan, maturity, due, rm, docs });
    $("copy").disabled = false;
  }

  $("copy").addEventListener("click", async () => {
    const text = $("message").textContent;
    const done = () => { $("copy").textContent = "복사했어요"; setTimeout(() => { $("copy").textContent = "안내 문장 복사"; }, 1400); };
    try { await navigator.clipboard.writeText(text); done(); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch { $("error").textContent = "복사가 막혔어요. 문장을 직접 드래그해 복사해 주세요."; }
      ta.remove();
    }
  });

  // 처음 열면 가짜 예시: 만기일은 오늘부터 4주 뒤, 회신 기한은 만기일 2주 전
  const m0 = addDays(today(), 28);
  $("maturity").value = toInput(m0);
  $("due").value = toInput(addDays(m0, -14));

  for (const el of document.querySelectorAll("input, select")) {
    el.addEventListener("input", update);
    el.addEventListener("change", update);
  }
  update();
</script>
</body>
</html>
