<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
  <script src="daily.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>오늘 할 일</h1>
        <p id="remaining" role="status">목록을 불러오는 중…</p>
      </div>
      <div class="cat" role="img" aria-label="웃고 있는 귀여운 고양이">
        <span class="ear left"></span><span class="ear right"></span>
        <div class="face">
          <span class="eye left"></span><span class="eye right"></span>
          <span class="nose"></span><span class="smile">ω</span>
          <span class="cheek left"></span><span class="cheek right"></span>
        </div>
      </div>
    </header>
    <section class="calendar" aria-label="할 일 캘린더">
      <div class="calendar-heading">
        <button id="previous-month" type="button" aria-label="이전 달">‹</button>
        <h2 id="calendar-month" aria-live="polite"></h2>
        <button id="next-month" type="button" aria-label="다음 달">›</button>
        <button id="today" type="button">오늘</button>
      </div>
      <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="calendar-days" class="calendar-days"></div>
      <p class="calendar-hint">점이 있는 날짜에 할 일이 있어요.</p>
    </section>
    <label for="task-date">할 일 날짜</label>
    <input id="task-date" type="date" required aria-describedby="date-help">
    <p id="date-help">선택한 날짜의 목록을 보고 할 일을 추가해요.</p>
    <form id="todo-form" novalidate>
      <label for="todo-input">새로운 할 일</label>
      <div class="input-row">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" aria-describedby="message" disabled>
        <button id="add-button" type="submit" disabled>추가</button>
      </div>
    </form>
    <p id="message" role="alert"></p>
    <p id="empty" hidden>이 날짜에는 할 일이 없어요.</p>
    <ul id="todo-list" aria-label="할 일 목록"></ul>
    <section class="daily-card" aria-labelledby="exchange-title">
      <div class="daily-heading">
        <h2 id="exchange-title">오늘의 환율</h2>
        <button id="refresh-rates" type="button">새로고침</button>
      </div>
      <div id="rates" aria-live="polite">환율을 불러오는 중…</div>
      <p class="daily-note">원화 기준 · 최신 공시 참고 환율</p>
      <a href="https://frankfurter.dev/" target="_blank" rel="noopener noreferrer">환율 제공 Frankfurter</a>
    </section>
    <section class="daily-card" aria-labelledby="weather-title">
      <div class="daily-heading">
        <h2 id="weather-title">오늘의 날씨</h2>
        <button id="refresh-weather" type="button">새로고침</button>
      </div>
      <label for="weather-city">날씨 지역</label>
      <select id="weather-city">
        <option value="seoul">서울</option><option value="busan">부산</option>
        <option value="incheon">인천</option><option value="daegu">대구</option>
        <option value="daejeon">대전</option><option value="gwangju">광주</option>
        <option value="ulsan">울산</option><option value="suwon">수원</option>
        <option value="chuncheon">춘천</option><option value="gangneung">강릉</option>
        <option value="cheongju">청주</option><option value="jeonju">전주</option>
        <option value="jeju">제주</option>
      </select>
      <div id="weather" aria-live="polite">날씨를 불러오는 중…</div>
      <p id="weather-message" class="daily-note" role="status"></p>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">날씨 제공 Open-Meteo</a>
    </section>
  </main>
</body>
</html>
