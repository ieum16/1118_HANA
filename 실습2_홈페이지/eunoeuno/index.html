.schedule-item a {

}

footer {

@media (min-width: 1600px) {

    font-size: 22px;
  }
  .schedule-item {
    gap: 10px;
  }
  .schedule-item > time {
    width: 48px;
    font-size: 12px;
  }
  .schedule-item h4 {
    font-size: 15px;
  }
  .record-actions .icon-button {
    padding: 5px;
    min-width: 28px;
  }
  .schedule-item .record-actions {
    flex-direction: column;
  }
  .empty {
    min-height: 220px;
  }
  .empty p {
    font-size: 13px;
  }
  .place-card {
    padding: 20px;
  }
  .topbar > p {
    font-size: 12px;
  }
  footer {
    font-size: 11px;
    padding: 22px 0;
  }
  .editor-dialog {
    padding: 22px;
  }
  .dialog-heading h2 {
    font-size: 22px;
  }
  .form-pair {
    gap: 10px;
  }
}

.login-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px;
  background: #eef2df;
  gap: 20px;
}
.login-page > img {
  width: 220px;
  border-radius: 25px;
}
.login-page h1 {
  font-size: 30px;
}
.login-page p {
  color: #73845a;
}
.login-page a {
  display: inline-flex;
  margin-top: 8px;
}
.mobile-signout {
  display: none;
}
@media (max-width: 760px) {
  .mobile-signout {
    display: inline-flex;
  }
}

h1,h2,h3,h4 { word-break: keep-all; overflow-wrap: break-word; }
@media(max-width:760px){
.sidebar nav button{flex:1;flex-direction:column;gap:4px;padding:8px 2px;font-size:12px;white-space:nowrap}
.topbar>p{white-space:nowrap}.family-label{display:none}
.hero{flex-direction:column-reverse;align-items:center;text-align:center;padding:24px;gap:18px}
.hero-logo{position:static;width:105px;padding:7px;transform:rotate(2deg)}
.hero h1,.hero .eyebrow{max-width:100%}.hero h1{font-size:30px}
.hero-description{margin:16px 0 20px}.hero-actions{justify-content:center}
}
