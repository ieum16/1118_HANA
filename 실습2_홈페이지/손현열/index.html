<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI 연수에서 배운 내용을 웹페이지 제작에 적용하는 AI연수팀입니다.">
  <title>AI연수팀</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171b1a;
      --muted: #505b59;
      --paper: #fff;
      --accent: #2ab9b4;
      --accent-dark: #006964;
      --line: #d9e3e1;
      --gutter: clamp(20px, 6vw, 72px);
      --header-height: 68px;
      font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.65; }
    :focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 5px; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .frame { width: min(100% - var(--gutter) * 2, 1000px); margin-inline: auto; }
    .section { scroll-margin-top: calc(var(--header-height) + 24px); }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.22; word-break: keep-all; overflow-wrap: anywhere; }
    p { word-break: keep-all; overflow-wrap: anywhere; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: var(--header-height);
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: calc(var(--header-height) - 1px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      font-size: 1rem;
    }
    .brand-image { width: 32px; height: 32px; object-fit: contain; border-radius: 8px; }
    .site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px clamp(12px, 3vw, 32px); }
    .site-nav a { padding-block: 8px; font-size: .9375rem; font-weight: 750; text-decoration: none; }
    .site-nav a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 5px; }
    .menu-toggle {
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #aab9b6;
      border-radius: 4px;
      min-height: 44px;
      padding: 6px 11px;
      background: var(--paper);
      color: inherit;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    .menu-icon {
      width: 16px;
      height: 12px;
      border-block: 2px solid currentColor;
      background: linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(24px, 6vw, 86px);
      padding-block: clamp(60px, 9vw, 118px);
    }
    .hero h1 { font-size: clamp(3rem, 7.3vw, 6.125rem); font-weight: 900; letter-spacing: -.075em; }
    .hero p { max-width: 29ch; margin-top: 19px; font-size: clamp(1.0625rem, 2vw, 1.375rem); color: var(--muted); }
    .hero-link {
      display: inline-block;
      margin-top: 25px;
      border-radius: 3px;
      padding: 11px 19px;
      background: var(--accent);
      font-weight: 850;
      text-decoration: none;
    }
    .hero-link:hover { background: #62d2cc; }
    .mascot {
      display: block;
      width: 100%;
      height: auto;
      background: #e1f3ef;
    }

    .content-section { padding-block: clamp(28px, 4vw, 46px) clamp(48px, 6vw, 76px); border-top: 1px solid var(--ink); }
    .content-section h2 { margin-bottom: 24px; font-size: clamp(1.625rem, 3vw, 2.375rem); letter-spacing: -.05em; }
    .project-card {
      display: flex;
      align-items: center;
      gap: clamp(12px, 3vw, 24px);
      border: 1px dashed #91abab;
      padding: clamp(18px, 3.5vw, 32px);
      background: #f5faf9;
    }
    .project-card p, .practice-card p { color: var(--muted); }
    .status {
      flex: none;
      padding: 4px 10px;
      background: #d6f3ef;
      color: var(--accent-dark);
      font-size: .875rem;
      font-weight: 850;
    }
    .practice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 4vw, 36px); }
    .practice-art { display: block; width: 100%; height: auto; margin-bottom: 16px; }
    .practice-card h3 { margin-bottom: 7px; font-size: clamp(1.125rem, 2vw, 1.375rem); letter-spacing: -.035em; }
    .site-footer { background: #f4f7f6; padding-block: 24px; color: var(--muted); font-size: .9375rem; }

    @media (max-width: 639px) {
      :root { --gutter: 16px; --header-height: 62px; }
      .header-inner { flex-wrap: wrap; gap: 8px; }
      .menu-toggle:not([hidden]) { display: inline-flex; }
      .site-nav { width: 100%; flex-direction: column; align-items: stretch; gap: 0; padding-bottom: 10px; }
      .site-nav a { min-height: 44px; padding-inline: 8px; }
      .enhanced .site-nav {
        position: absolute;
        inset: 100% 0 auto;
        padding: 8px var(--gutter) 12px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .hero { grid-template-columns: 1fr; padding-top: 46px; }
      .practice-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 400px) {
      .project-card { flex-direction: column; align-items: flex-start; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="frame header-inner">
      <a class="brand" href="#intro">
        <span class="brand-mark" aria-hidden="true">A</span>
        <img class="brand-image" width="32" height="32" alt="" hidden>
        AI연수팀
      </a>
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" hidden>
        <span class="menu-icon" aria-hidden="true"></span>
        메뉴
      </button>
      <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
        <a href="#intro">팀 소개</a>
        <a href="#projects">만든 웹페이지</a>
        <a href="#practice">배운 내용과 적용 사례</a>
      </nav>
    </div>
  </header>

  <main class="frame">
    <section class="section hero" id="intro" aria-labelledby="team-title">
      <div>
        <h1 id="team-title">AI연수팀</h1>
        <p>AI 연수에서 배운 내용을 활용해 웹페이지를 만듭니다.</p>
        <a class="hero-link" href="#projects">만든 웹페이지 보기</a>
      </div>

      <svg class="mascot" viewBox="0 0 500 354" role="img" aria-labelledby="mascot-title">
        <title id="mascot-title">반쯤 감긴 눈으로 브라우저 화면을 살펴보는 초록 개구리</title>
        <defs>
          <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="1.5" fill="#17271d" opacity=".18"/>
          </pattern>
        </defs>
        <path d="M0 0h500v354H0z" fill="url(#dots)"/>
        <ellipse cx="249" cy="294" rx="184" ry="25" fill="#b5ded8"/>
        <g fill="none" stroke="#17271d" stroke-width="4" stroke-linecap="round">
          <path d="M84 204v23m-12-11h24M405 76v27m-13-14h26M433 222v16m-8-8h16"/>
        </g>
        <g transform="rotate(-8 218 179)" stroke="#17271d" stroke-width="4" stroke-linejoin="round">
          <rect x="121" y="82" width="196" height="182" rx="14" fill="#339f95"/>
          <rect x="114" y="75" width="196" height="182" rx="14" fill="#fff"/>
          <path d="M114 106h196" fill="none"/>
          <circle cx="131" cy="91" r="3.5" fill="#c57d5d" stroke="none"/>
          <circle cx="144" cy="91" r="3.5" fill="#82b74b" stroke="none"/>
          <circle cx="157" cy="91" r="3.5" fill="#a5c6da" stroke="none"/>
          <rect x="132" y="122" width="160" height="48" rx="7" fill="#d2eee7" stroke="none"/>
          <path d="M143 139h57m-57 13h89" stroke-width="3" stroke-linecap="round" opacity=".6"/>
          <rect x="132" y="181" width="49" height="56" rx="7" fill="#9ad8d4" stroke="none"/>
          <rect x="190" y="181" width="49" height="56" rx="7" fill="#e7b39d" stroke="none"/>
        </g>
        <g stroke="#17271d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M222 277c7-35 37-56 75-56 42 0 76 19 88 56-35 19-119 22-163 0Z" fill="#4bb3ac"/>
          <path d="M233 197c-9-13-6-33 4-45 10-13 27-17 42-8 12-17 34-21 49-11 14 9 20 23 17 39 22 7 33 24 28 43-6 23-28 38-63 40-35 3-70-8-81-30-5-10-4-20 4-28Z" fill="#82b74b"/>
          <path d="M234 178c0-17 10-28 23-28s21 12 21 29c-14 7-29 7-44-1Z" fill="#fff8e8"/>
          <path d="M281 172c2-19 13-31 28-30 15 1 25 13 25 28-16 10-36 10-53 2Z" fill="#fff8e8"/>
          <path d="M234 177c5-16 32-19 44-2m3-4c11-16 38-18 53-2" fill="#82b74b"/>
          <path d="M253 178v4m51-8v5" stroke-width="7"/>
          <path d="M245 213c17-9 40-2 59 1 17 3 33 0 48-11-1 17-16 28-41 29-26 2-52-6-66-19Z" fill="#c57d5d"/>
          <path d="M251 214c26 10 69 14 97-8" fill="none" stroke-width="3"/>
          <path d="M228 273c-12 3-24 1-29-5-4-5-1-11 7-12-7-5-3-12 5-12 12-1 22 6 34 14" fill="#82b74b"/>
        </g>
      </svg>
    </section>

    <section class="section content-section" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">만든 웹페이지</h2>
      <div class="project-card">
        <span class="status">준비 중</span>
        <p>팀 웹페이지를 만들고 있어요. 완성되면 여기에 링크를 공개할 예정입니다.</p>
      </div>
    </section>

    <section class="section content-section" id="practice" aria-labelledby="practice-title">
      <h2 id="practice-title">배운 내용과 적용 사례</h2>
      <div class="practice-grid">
        <article class="practice-card">
          <svg class="practice-art" viewBox="0 0 480 230" aria-hidden="true">
            <rect width="480" height="230" fill="#d8f0ea"/>
            <circle cx="365" cy="83" r="58" fill="#b5e3d8"/>
            <g stroke="#28423e" stroke-width="2" stroke-linejoin="round">
              <rect x="147" y="65" width="218" height="128" rx="6" fill="#fff"/>
              <path d="M147 88h218" fill="none"/>
              <path d="M161 77h4m6 0h4m6 0h4" stroke-linecap="round"/>
              <rect x="167" y="101" width="178" height="32" rx="3" fill="#a3dcd3" stroke="none"/>
              <path d="M167 143h53v35h-53zm62 0h54v35h-54zm63 0h53v35h-53z" fill="#e7eeeb" stroke="none"/>
              <path d="M112 37h144a7 7 0 0 1 7 7v40a7 7 0 0 1-7 7h-99l-24 16V91h-21a7 7 0 0 1-7-7V44a7 7 0 0 1 7-7Z" fill="#fff"/>
              <path d="M123 56h92m-92 15h67" stroke="#007d75" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>
          <h3>AI에게 화면과 문구 초안 요청하기</h3>
          <p>AI에 웹페이지의 화면 구성과 각 영역에 들어갈 문구 초안을 요청했습니다.</p>
        </article>
        <article class="practice-card">
          <svg class="practice-art" viewBox="0 0 480 230" aria-hidden="true">
            <rect width="480" height="230" fill="#e8edf1"/>
            <circle cx="133" cy="119" r="62" fill="#d2e0e6"/>
            <g stroke="#28423e" stroke-width="2" stroke-linejoin="round">
              <rect x="116" y="40" width="229" height="140" rx="6" fill="#fff"/>
              <path d="M116 64h229m-215-12h4m6 0h4m6 0h4" stroke-linecap="round" fill="none"/>
              <rect x="135" y="80" width="191" height="32" rx="3" fill="#a3dcd3" stroke="none"/>
              <path d="M135 122h88v39h-88zm102 0h89v39h-89z" fill="#e7eeeb" stroke="none"/>
              <rect x="285" y="94" width="71" height="110" rx="9" fill="#fff"/>
              <path d="M295 117h51v27h-51zm0 34h51v8h-51zm0 13h51v8h-51z" fill="#a3dcd3" stroke="none"/>
              <path d="M312 105h17m-13 87h9" fill="none" stroke-linecap="round"/>
              <path d="M251 134l3 31 8-9 8 12 6-4-8-12 12-4Z" fill="#2ab9b4"/>
            </g>
          </svg>
          <h3>미리보기로 확인하고 수정하기</h3>
          <p>초안을 실제 화면으로 미리 본 뒤, 구성과 문구를 확인하며 수정했습니다.</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="frame">AI연수팀</div>
  </footer>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const navigation = document.querySelector("#site-nav");
    const brandLink = document.querySelector(".brand");
    const mobile = window.matchMedia("(max-width: 639px)");
    document.documentElement.classList.add("enhanced");

    function setMenu(open) {
      navigation.hidden = mobile.matches && !open;
      menuButton.setAttribute("aria-expanded", String(mobile.matches && open));
    }

    function syncMenu() {
      menuButton.hidden = !mobile.matches;
      if (mobile.matches && navigation.contains(document.activeElement)) {
        menuButton.focus();
      } else if (!mobile.matches && document.activeElement === menuButton) {
        brandLink.focus();
      }
      setMenu(false);
    }

    mobile.addEventListener("change", syncMenu);
    syncMenu();

    menuButton.addEventListener("click", () => {
      setMenu(menuButton.getAttribute("aria-expanded") !== "true");
    });

    navigation.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (!link || !mobile.matches) return;
      const section = document.querySelector(link.hash);
      section.setAttribute("tabindex", "-1");
      section.focus({ preventScroll: true });
      setMenu(false);
    });

    brandLink.addEventListener("click", () => setMenu(false));
    document.querySelector(".site-header").addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || menuButton.getAttribute("aria-expanded") !== "true") return;
      setMenu(false);
      menuButton.focus();
    });

    const logo = document.querySelector(".brand-image");
    const temporaryLogo = document.querySelector(".brand-mark");
    logo.addEventListener("load", () => {
      logo.hidden = false;
      temporaryLogo.hidden = true;
    });
    logo.src = "images/logo.png";
  </script>
</body>
</html>
