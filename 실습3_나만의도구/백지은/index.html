<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="인증서 교체, 사업 품의, 정기 작업의 마감일과 진행 상태를 보는 실습용 팀 일정 대시보드">
  <title>팀 일정 관리 · 업무 OS</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #192844;
      --text: #26354d;
      --muted: #576781;
      --line: #dce3ed;
      --surface: #fff;
      --bg: #f3f6fa;
      --blue: #284fc4;
      --blue-light: #eaf0ff;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; line-height: 1.55; overflow-wrap: anywhere; word-break: keep-all; }
    h1, h2, h3, p, ul, ol { margin: 0; }
    h1, h2, h3 { color: var(--navy); line-height: 1.25; letter-spacing: -.045em; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .52; cursor: default; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .wrap { width: min(77rem, calc(100% - 3rem)); margin-inline: auto; }
    .app-header { border-bottom: 1px solid var(--line); background: var(--surface); }
    .header-inner { min-height: 4.5rem; display: flex; align-items: center; justify-content: space-between; gap: .8rem 1.5rem; }
    .brand, .header-actions, .identity, .panel-tools, .month-nav, .editor-actions, .badges { display: flex; align-items: center; gap: .55rem; }
    .brand { color: var(--navy); font-weight: 850; }
    .mark { display: grid; place-items: center; width: 2rem; aspect-ratio: 1; border-radius: .55rem; background: var(--navy); color: white; line-height: 1; }
    .identity { color: var(--muted); font-size: .875rem; font-weight: 750; }
    .identity select, .field input, .field select, .field textarea { min-width: 0; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: .5rem; background: white; color: var(--text); }
    .header-actions, .panel-tools, .badges, .editor-actions { flex-wrap: wrap; }
    .button { padding: .48rem .75rem; border: 1px solid #cdd7e5; border-radius: .5rem; background: white; color: var(--navy); font-size: .875rem; font-weight: 750; }
    .button:hover:not(:disabled) { background: var(--bg); }
    .primary { border-color: var(--blue); background: var(--blue); color: white; }
    .primary:hover:not(:disabled) { background: #203da1; }
    .quiet { border-color: transparent; background: transparent; color: var(--blue); }
    .primary, .identity select { min-height: 2.5rem; }
    main { padding-block: 1.5rem 2.65rem; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 1.3rem 2rem; padding: clamp(1.35rem, 3.4vw, 2.4rem); border-radius: 1rem; background: radial-gradient(ellipse at 92% 5%, #394f81 0, transparent 65%), #192844; color: #e2eaff; }
    .hero time { display: block; margin-bottom: .5rem; color: #d1ddf8; font-size: .9rem; font-weight: 750; }
    .hero h1 { margin-bottom: .5rem; color: white; font-size: clamp(1.9rem, 4vw, 3.1rem); }
    .hero-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 13rem; margin: 0; border: 1px solid #ffffff47; border-radius: .7rem; background: #ffffff10; }
    .hero-summary div { padding: .65rem .85rem; }
    .hero-summary div + div { border-left: 1px solid #ffffff47; }
    .hero-summary dt { color: #d1ddf8; font-size: .8rem; }
    .hero-summary dd { margin: .05rem 0 0; color: white; font-size: 1.5rem; font-weight: 850; }
    .feedback { margin-top: .8rem; padding: .6rem .85rem; border: 1px solid #bccdf8; border-radius: .5rem; background: var(--blue-light); color: var(--navy); }
    .feedback:empty { display: none; }
    .dashboard { display: grid; grid-template-columns: minmax(15rem, 1fr) minmax(0, 2fr); align-items: start; gap: 1rem; margin-top: 1rem; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: .85rem; background: white; }
    .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: 1rem 1.15rem; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: clamp(1.15rem, 2vw, 1.38rem); }
    .panel-head p { margin-top: .25rem; color: var(--muted); font-size: .84rem; }
    .timeline-head { padding: .75rem 1.15rem; border-bottom: 1px solid var(--line); }
    .month-nav { justify-content: space-between; flex-wrap: wrap; }
    .month-title { font-weight: 850; color: var(--navy); }
    .month-nav .button { min-width: 2.1rem; }
    .entries { list-style: none; padding: .8rem; }
    .entries:empty { padding: 0; }
    .entry + .entry { margin-top: .55rem; }
    .entry { display: grid; grid-template-columns: 4rem minmax(0, 1fr) auto; align-items: start; gap: .55rem .75rem; padding: .7rem .75rem; border: 1px solid var(--line); border-radius: .65rem; }
    .entry.mine { border-color: #b8c9fc; border-inline-start: 3px solid var(--blue); background: #f4f7ff; }
    .entry-date { color: var(--navy); font-size: .875rem; font-weight: 850; }
    .entry-title { margin-block: .14rem .32rem; font-size: 1.03rem; }
    .entry-note, .entry-detail { color: var(--muted); font-size: .86rem; }
    .entry-note { margin-top: .28rem; white-space: pre-wrap; }
    .badge { display: inline-block; padding: .13rem .44rem; border-radius: .35rem; background: #edf1f6; color: #394c69; font-size: .755rem; font-weight: 750; }
    .badge.mine-tag { background: #dfe8ff; color: #2345a8; }
    .badge[data-status="active"] { background: #dfebff; color: #20499b; }
    .badge[data-status="review"] { background: #fff0d4; color: #704500; }
    .badge[data-status="complete"] { background: #dff3e9; color: #195a43; }
    .badge[data-urgency="late"] { background: #ffe9e7; color: #8b2923; }
    .soon .entry { grid-template-columns: minmax(0, 1fr) auto; }
    .soon .entry-date { grid-column: 1 / -1; }
    .soon .entry .button { padding: .32rem .45rem; }
    .empty { padding: 1rem 1.15rem; color: var(--muted); }
    .local-note { margin-top: .85rem; color: var(--muted); font-size: .855rem; }
    dialog { width: min(32rem, calc(100% - 2rem)); max-height: calc(100dvh - 2rem); padding: 0; border: 1px solid var(--line); border-radius: .9rem; color: var(--text); background: white; }
    dialog::backdrop { background: #101b31a6; }
    .editor { padding: 1.15rem; }
    .editor h2 { margin-bottom: .9rem; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
    .field { display: grid; align-content: start; gap: .25rem; min-width: 0; color: var(--navy); font-size: .875rem; font-weight: 750; }
    .field input, .field select, .field textarea { width: 100%; font-weight: 500; }
    .field textarea { min-height: 4rem; resize: vertical; }
    .wide, .rule { grid-column: 1 / -1; }
    .rule { color: var(--muted); font-size: .82rem; }
    .editor-actions { justify-content: flex-end; margin-top: .9rem; }
    @media (max-width: 800px) {
      .wrap { width: calc(100% - 2rem); }
      .header-inner { flex-wrap: wrap; padding-block: .7rem; }
      .dashboard { grid-template-columns: 1fr; }
    }
    @media (max-width: 485px) {
      .hero { grid-template-columns: 1fr; }
      .hero-summary { min-width: 0; }
      .entry { grid-template-columns: minmax(0, 1fr) auto; }
      .entry-date { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="wrap header-inner">
      <div class="brand"><span class="mark" aria-hidden="true">일</span> 지니니팀 업무 OS</div>
      <div class="header-actions">
        <label class="identity" for="identity">내 담당자 <select id="identity"></select></label>
        <button class="button" id="backup" type="button">백업</button>
        <button class="button" id="restore" type="button">복원</button>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <time id="today"></time>
        <h1 id="page-title">팀 일정 관리</h1>
        <p>안녕하세요. 내 마감과 팀의 진행 상황을 한곳에서 확인하세요.</p>
      </div>
      <dl class="hero-summary">
        <div><dt>내 마감 임박</dt><dd id="urgent-count">0</dd></div>
        <div><dt>선택한 달의 일정</dt><dd id="month-count">0</dd></div>
      </dl>
    </section>

    <p class="feedback" id="feedback" role="status"></p>

    <div class="dashboard">
      <section class="panel soon" aria-labelledby="urgent-title">
        <div class="panel-head">
          <div><h2 id="urgent-title">내 마감 임박 업무</h2><p>기한이 지났거나 14일 안에 도래하는 미완료 업무</p></div>
        </div>
        <ul class="entries" id="urgent-list"></ul>
        <p class="empty" id="urgent-empty" hidden>임박한 미완료 업무가 없어요.</p>
      </section>

      <section class="panel" aria-labelledby="timeline-title">
        <div class="panel-head">
          <div><h2 id="timeline-title">팀 전체 월간 타임라인</h2><p>모든 담당자의 일정과 진행 상태</p></div>
          <div class="panel-tools">
            <button class="button quiet" id="clear-samples" type="button">예시 지우기</button>
            <button class="button primary" id="add" type="button">일정 추가</button>
          </div>
        </div>
        <div class="timeline-head month-nav">
          <div class="month-nav">
            <button class="button" id="prev" type="button" aria-label="이전 달">‹</button>
            <p class="month-title" id="month-title" aria-live="polite"></p>
            <button class="button" id="next" type="button" aria-label="다음 달">›</button>
          </div>
          <button class="button" id="current-month" type="button">이번 달</button>
        </div>
        <ul class="entries" id="timeline"></ul>
        <p class="empty" id="timeline-empty" hidden>이 달에 표시할 일정이 없어요.</p>
      </section>
    </div>
    <p class="local-note">실습용 · 이 브라우저에 저장됩니다. 다른 기기에서 이어서 보려면 JSON으로 백업하고 복원하세요.</p>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form class="editor" id="task-form">
      <h2 id="editor-title">일정 추가</h2>
      <div class="fields">
        <label class="field wide" for="task-title">업무명<input id="task-title" maxlength="100" required autofocus></label>
        <label class="field" for="task-type">유형<select id="task-type" required></select></label>
        <label class="field" for="task-owner">담당자<select id="task-owner" required></select></label>
        <label class="field wide" id="date-field" for="task-date"><span id="date-label">기준일</span><input id="task-date" type="date" min="1900-01-31" max="9999-12-31"></label>
        <label class="field wide" id="month-field" for="task-month" hidden>정기 작업 시작 월<input id="task-month" type="month" min="1900-01" max="9999-12"></label>
        <p class="rule" id="date-rule"></p>
        <label class="field wide" for="task-status"><span id="status-label">진행 상태</span><select id="task-status" required></select></label>
        <label class="field wide" for="task-note">메모 <textarea id="task-note" maxlength="500"></textarea></label>
      </div>
      <div class="editor-actions">
        <button class="button" id="cancel" type="button">취소</button>
        <button class="button primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <template id="entry-template">
    <li class="entry">
      <time class="entry-date"></time>
      <div>
        <div class="badges">
          <span class="badge entry-type"></span><span class="badge entry-status"></span>
          <span class="badge mine-tag" hidden>내 담당</span><span class="badge entry-urgency" hidden></span>
        </div>
        <h3 class="entry-title"></h3>
        <p class="entry-detail"></p>
        <p class="entry-note" hidden></p>
      </div>
      <button class="button entry-edit" type="button">수정</button>
    </li>
  </template>

  <script>
    const byId = (id) => document.getElementById(id);
    const storageKey = 'myos:team-schedule';
    const owners = { a: '담당자 A', b: '담당자 B', c: '담당자 C' };
    const statuses = { planned: '예정', active: '진행 중', review: '검토 중', complete: '완료' };
    const types = {
      certificate: { name: '인증서 교체', anchor: '만료일', event: '교체 시작', offset: 30 },
      approval: { name: '사업 품의', anchor: '사업 착수일', event: '승인 마감', offset: 14 },
      monthly: { name: '정기 작업', event: '매월 둘째 수요일' },
    };
    const dateFormat = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', dateStyle: 'long' });
    const todayFormat = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', dateStyle: 'full' });
    const shortFormat = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', month: 'numeric', day: 'numeric' });
    const monthFormat = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', year: 'numeric', month: 'long' });
    const dayKey = (date) => date.toISOString().slice(0, 10);
    const monthOf = (day) => day.slice(0, 7);
    const fromDay = (day) => new Date(day + 'T00:00:00Z');
    const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const currentMonth = monthOf(today);

    function shiftDay(day, amount) {
      const date = fromDay(day);
      date.setUTCDate(date.getUTCDate() + amount);
      return dayKey(date);
    }

    function shiftMonth(month, amount) {
      const date = fromDay(month + '-01');
      date.setUTCMonth(date.getUTCMonth() + amount);
      return monthOf(dayKey(date));
    }

    function secondWednesday(month) {
      const first = fromDay(month + '-01');
      const firstWednesdayOffset = (3 - first.getUTCDay() + 7) % 7;
      return shiftDay(month + '-01', 7 + firstWednesdayOffset);
    }

    const isObject = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
    const isMonth = (value) => typeof value === 'string' && /^(19\d\d|[2-9]\d{3})-(0[1-9]|1[0-2])$/.test(value);

    function isDay(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value) || !isMonth(monthOf(value))) return false;
      const date = fromDay(value);
      return Number.isFinite(date.getTime()) && dayKey(date) === value;
    }

    function validTask(task) {
      if (!isObject(task) || typeof task.id !== 'string' || !task.id ||
          typeof task.title !== 'string' || !task.title.trim() || task.title.length > 100 ||
          typeof task.note !== 'string' || task.note.length > 500 || typeof task.sample !== 'boolean' ||
          !Object.hasOwn(types, task.type) || !Object.hasOwn(owners, task.owner)) return false;
      if (task.type !== 'monthly') {
        return isDay(task.anchor) && task.anchor >= '1900-01-31' && Object.hasOwn(statuses, task.status);
      }
      return isMonth(task.start) && isObject(task.monthStatuses) &&
        Object.entries(task.monthStatuses).every(([month, status]) =>
          isMonth(month) && month >= task.start && Object.hasOwn(statuses, status));
    }

    function validState(value) {
      return isObject(value) && value.version === 1 && Object.hasOwn(owners, value.owner) &&
        Array.isArray(value.tasks) && value.tasks.every(validTask) &&
        new Set(value.tasks.map((task) => task.id)).size === value.tasks.length;
    }

    function exampleTasks() {
      return [
        { id: 'example-1', title: '테스트 인증서 교체', type: 'certificate', owner: 'a', anchor: shiftDay(today, 34), status: 'active', note: '교체 전 점검 항목을 정리하는 중', sample: true },
        { id: 'example-2', title: '업무 개선 사업 품의', type: 'approval', owner: 'b', anchor: shiftDay(today, 20), status: 'review', note: '검토 의견 확인 중', sample: true },
        { id: 'example-3', title: '정기 운영 점검', type: 'monthly', owner: 'a', start: currentMonth, monthStatuses: {}, note: '예정일에 점검 결과 정리', sample: true },
        { id: 'example-4', title: '월간 작업 결과 정리', type: 'monthly', owner: 'c', start: currentMonth, monthStatuses: { [currentMonth]: 'complete' }, note: '팀 공유용 요약', sample: true },
        { id: 'example-5', title: '예비 환경 인증서 교체', type: 'certificate', owner: 'c', anchor: shiftDay(today, 45), status: 'planned', note: '', sample: true },
      ];
    }

    function readState() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved !== null) {
          const parsed = JSON.parse(saved);
          if (validState(parsed)) return parsed;
          byId('feedback').textContent = '저장한 형식을 읽을 수 없어 예시 업무를 표시합니다.';
        }
      } catch {
        byId('feedback').textContent = '저장된 일정을 읽을 수 없어 예시 업무를 표시합니다.';
      }
      return { version: 1, owner: 'a', tasks: exampleTasks() };
    }

    let state = readState();
    let viewedMonth = currentMonth;
    let editing = null;
    const dialog = byId('editor');
    const form = byId('task-form');
    const typeField = byId('task-type');
    const dateInput = byId('task-date');
    const monthInput = byId('task-month');
    const statusInput = byId('task-status');
    const titleInput = byId('task-title');

    function setOptions(select, options) {
      for (const [value, label] of Object.entries(options)) select.add(new Option(label, value));
    }

    setOptions(byId('identity'), owners);
    setOptions(byId('task-owner'), owners);
    setOptions(typeField, Object.fromEntries(Object.entries(types).map(([key, type]) => [key, type.name])));
    setOptions(statusInput, statuses);
    byId('today').dateTime = today;
    byId('today').textContent = todayFormat.format(fromDay(today));

    function save(message) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
        byId('feedback').textContent = message;
      } catch {
        byId('feedback').textContent = '브라우저 저장이 제한됐어요. 현재 변경 사항을 유지하려면 백업하세요.';
      }
      render();
    }

    function singleDate(task) {
      return shiftDay(task.anchor, -types[task.type].offset);
    }

    function occurrence(task, month, date) {
      return {
        task,
        date: date ?? secondWednesday(month),
        month,
        status: task.type === 'monthly' ? (task.monthStatuses[month] || 'planned') : task.status,
      };
    }

    function monthlyEntries(month) {
      const items = [];
      for (const task of state.tasks) {
        if (task.type === 'monthly') {
          if (task.start <= month) items.push(occurrence(task, month));
        } else {
          const date = singleDate(task);
          if (monthOf(date) === month) items.push(occurrence(task, month, date));
        }
      }
      return items;
    }

    function urgentEntries() {
      const cutoff = shiftDay(today, 14);
      const items = [];
      for (const task of state.tasks) {
        if (task.owner !== state.owner) continue;
        if (task.type !== 'monthly') {
          const date = singleDate(task);
          if (date <= cutoff && task.status !== 'complete') items.push(occurrence(task, monthOf(date), date));
          continue;
        }
        for (let month = task.start; month <= monthOf(cutoff); month = shiftMonth(month, 1)) {
          const item = occurrence(task, month);
          if (item.date <= cutoff && item.status !== 'complete') items.push(item);
        }
      }
      return items;
    }

    const entryOrder = (a, b) => a.date.localeCompare(b.date) || a.task.title.localeCompare(b.task.title, 'ko');

    function entryNode(item, urgent) {
      const row = byId('entry-template').content.firstElementChild.cloneNode(true);
      const find = (selector) => row.querySelector(selector);
      const type = types[item.task.type];
      const mine = item.task.owner === state.owner;
      row.classList.toggle('mine', mine);
      row.dataset.taskId = item.task.id;
      row.dataset.status = item.status;
      const date = find('.entry-date');
      date.dateTime = item.date;
      date.textContent = shortFormat.format(fromDay(item.date));
      find('.entry-title').textContent = item.task.title;
      find('.entry-type').textContent = type.name;
      find('.entry-status').textContent = statuses[item.status];
      find('.entry-status').dataset.status = item.status;
      find('.mine-tag').hidden = !mine;
      const urgency = find('.entry-urgency');
      if (urgent && item.date <= today) {
        urgency.hidden = false;
        urgency.textContent = item.date === today ? '오늘 예정' : '기한 지남';
        urgency.dataset.urgency = item.date === today ? 'today' : 'late';
      }
      const anchor = item.task.type === 'monthly' ? '' : ' · ' + type.anchor + ' ' + dateFormat.format(fromDay(item.task.anchor));
      find('.entry-detail').textContent = owners[item.task.owner] + ' · ' + type.event + anchor;
      const note = find('.entry-note');
      note.textContent = item.task.note;
      note.hidden = !item.task.note;
      const edit = find('.entry-edit');
      edit.setAttribute('aria-label', item.task.title + ' 수정');
      edit.addEventListener('click', () => openEditor(item));
      return row;
    }

    function render() {
      const monthItems = monthlyEntries(viewedMonth).sort(entryOrder);
      const urgent = urgentEntries().sort(entryOrder);
      byId('identity').value = state.owner;
      byId('month-title').textContent = monthFormat.format(fromDay(viewedMonth + '-01'));
      byId('urgent-count').textContent = urgent.length;
      byId('month-count').textContent = monthItems.length;
      byId('urgent-list').replaceChildren(...urgent.map((item) => entryNode(item, true)));
      byId('timeline').replaceChildren(...monthItems.map((item) => entryNode(item, false)));
      byId('urgent-empty').hidden = urgent.length > 0;
      byId('timeline-empty').hidden = monthItems.length > 0;
      byId('clear-samples').hidden = !state.tasks.some((task) => task.sample);
      byId('prev').disabled = viewedMonth === '1900-01';
      byId('next').disabled = viewedMonth === '9999-12';
    }

    function editorMonth() {
      return editing?.task.type === 'monthly' && editing.month >= monthInput.value ? editing.month : monthInput.value;
    }

    function updateDateFields() {
      const recurring = typeField.value === 'monthly';
      const type = types[typeField.value];
      byId('date-field').hidden = dateInput.disabled = recurring;
      byId('month-field').hidden = monthInput.disabled = !recurring;
      dateInput.required = !recurring;
      monthInput.required = recurring;
      const statusMonth = editorMonth();
      byId('status-label').textContent = recurring && isMonth(statusMonth)
        ? monthFormat.format(fromDay(statusMonth + '-01')) + ' 진행 상태'
        : '진행 상태';
      if (recurring) {
        byId('date-rule').textContent = isMonth(monthInput.value)
          ? '매월 둘째 수요일 · 첫 일정 ' + dateFormat.format(fromDay(secondWednesday(monthInput.value)))
          : '시작 월부터 매월 둘째 수요일에 표시됩니다.';
        return;
      }
      byId('date-label').textContent = type.anchor;
      byId('date-rule').textContent = isDay(dateInput.value) && dateInput.value >= dateInput.min
        ? type.event + ' · ' + dateFormat.format(fromDay(shiftDay(dateInput.value, -type.offset)))
        : type.anchor + ' ' + type.offset + '일 전을 ' + type.event + '일로 계산합니다.';
    }

    function openEditor(item = null) {
      editing = item;
      const task = item?.task;
      byId('editor-title').textContent = task ? '일정 수정' : '일정 추가';
      titleInput.value = task?.title || '';
      titleInput.setCustomValidity('');
      typeField.value = task?.type || 'certificate';
      byId('task-owner').value = task?.owner || state.owner;
      dateInput.value = task?.anchor || '';
      monthInput.value = task?.start || viewedMonth;
      statusInput.value = item?.status || 'planned';
      byId('task-note').value = task?.note || '';
      updateDateFields();
      dialog.showModal();
    }

    function updateMonth(month) {
      viewedMonth = month;
      render();
    }

    byId('identity').addEventListener('change', (event) => {
      state.owner = event.target.value;
      save('');
    });
    byId('prev').addEventListener('click', () => updateMonth(shiftMonth(viewedMonth, -1)));
    byId('next').addEventListener('click', () => updateMonth(shiftMonth(viewedMonth, 1)));
    byId('current-month').addEventListener('click', () => updateMonth(currentMonth));
    byId('add').addEventListener('click', () => openEditor());
    byId('cancel').addEventListener('click', () => dialog.close());
    typeField.addEventListener('change', updateDateFields);
    dateInput.addEventListener('input', updateDateFields);
    monthInput.addEventListener('input', () => {
      if (editing?.task.type === 'monthly') {
        statusInput.value = editing.task.monthStatuses[editorMonth()] || 'planned';
      }
      updateDateFields();
    });
    titleInput.addEventListener('input', () => titleInput.setCustomValidity(''));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const existing = editing?.task;
      const task = {
        id: existing?.id || (crypto.randomUUID?.() ?? Date.now() + '-' + Math.random().toString(36).slice(2)),
        title: titleInput.value.trim(),
        type: typeField.value,
        owner: byId('task-owner').value,
        note: byId('task-note').value.trim(),
        sample: existing?.sample || false,
      };
      if (!task.title) {
        titleInput.setCustomValidity('업무명을 입력해 주세요.');
        titleInput.reportValidity();
        return;
      }
      let destination;
      if (task.type === 'monthly') {
        task.start = monthInput.value;
        task.monthStatuses = Object.fromEntries(Object.entries(existing?.monthStatuses || {})
          .filter(([month]) => month >= task.start));
        destination = editorMonth();
        task.monthStatuses[destination] = statusInput.value;
      } else {
        task.anchor = dateInput.value;
        task.status = statusInput.value;
      }
      if (!validTask(task)) {
        byId('date-rule').textContent = '날짜, 담당자와 상태를 확인해 주세요.';
        return;
      }
      if (task.type !== 'monthly') destination = monthOf(singleDate(task));
      state.tasks = existing ? state.tasks.map((current) => current.id === task.id ? task : current) : [...state.tasks, task];
      viewedMonth = destination;
      dialog.close();
      save(existing ? '일정을 수정했어요.' : '일정을 추가했어요.');
      byId('timeline').querySelector('[data-task-id="' + CSS.escape(task.id) + '"] button')?.focus();
    });

    byId('clear-samples').addEventListener('click', () => {
      state.tasks = state.tasks.filter((task) => !task.sample);
      save('예시 업무를 지웠어요.');
      byId('add').focus();
    });

    byId('backup').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'team-schedule-backup-' + today.replaceAll('-', '') + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      byId('feedback').textContent = '백업 파일을 내려받았어요.';
    });

    const backupFile = byId('backup-file');
    byId('restore').addEventListener('click', () => backupFile.click());
    backupFile.addEventListener('change', async () => {
      const file = backupFile.files[0];
      backupFile.value = '';
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
        if (!validState(data)) throw new Error('Invalid backup');
      } catch {
        byId('feedback').textContent = '이 페이지의 백업 파일인지 확인해 주세요. 현재 일정은 그대로입니다.';
        return;
      }
      if (!window.confirm('백업 파일의 일정으로 현재 내용을 바꿀까요?')) return;
      state = data;
      save('백업에서 일정을 복원했어요.');
    });

    render();
  </script>
</body>
</html>
