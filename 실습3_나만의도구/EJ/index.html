<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일일 채널 성과 증감 계산기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142641;
      --muted: #4e6077;
      --accent: #1b4782;
      --line: #d5dfeb;
      --background: #f2f6fb;
      --surface: #fff;
      --up: #0b6954;
      --down: #a12e32;
      --warning: #82450c;
      font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--background);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; line-height: 1.6; }
    header { background: #142641; color: white; }
    .wrap { width: min(100% - 2rem, 66rem); margin-inline: auto; }
    header .wrap { padding-block: clamp(1.75rem, 5vw, 3.25rem); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.55rem, 4vw, 2.4rem); line-height: 1.3; letter-spacing: -.045em; }
    header p { margin-top: .6rem; color: #dce8f7; }
    main { display: grid; gap: 1rem; padding-block: 1.25rem 2.5rem; }
    section { min-width: 0; padding: clamp(1rem, 3vw, 1.65rem); background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; }
    h2 { font-size: 1.17rem; letter-spacing: -.025em; }
    .hint { color: var(--muted); margin-top: .35rem; font-size: .9rem; }
    label { display: block; margin-top: .85rem; font-size: .9rem; font-weight: 650; }
    textarea {
      display: block; width: 100%; min-height: 9.5rem; resize: vertical; margin-top: .4rem;
      padding: .8rem; border: 1px solid #a8b9cc; border-radius: .6rem;
      background: #f8fafd; color: var(--ink); font: .9rem/1.65 ui-monospace, monospace;
      tab-size: 4; white-space: pre; overflow: auto;
    }
    #copy-text[wrap="soft"] { white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions, .section-heading, .result-actions { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; }
    .actions { margin-top: .8rem; }
    .section-heading { justify-content: space-between; }
    .result-actions { gap: .5rem; }
    button {
      min-height: 2.75rem; padding: .5rem .95rem; border: 1px solid var(--line);
      border-radius: .55rem; background: white; color: var(--accent); font: inherit;
      font-size: .9rem; font-weight: 650; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eef4fc; }
    .primary { background: var(--accent); border-color: var(--accent); color: white; }
    .primary:hover:not(:disabled) { background: #143965; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #4075bd; outline-offset: 3px; }
    .status { margin-top: .7rem; font-size: .9rem; color: var(--muted); }
    .notice { margin-top: .8rem; padding: .65rem .85rem; border-radius: .55rem; background: #fff5e6; color: var(--warning); font-size: .9rem; }
    .notice ul { margin: .25rem 0 0; padding-inline-start: 1.3rem; }
    .table-frame { margin-top: .75rem; border: 1px solid var(--line); border-radius: .65rem; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
    th, td { padding: .7rem .75rem; text-align: right; white-space: nowrap; }
    thead { background: #eaf0f8; color: #304663; }
    tbody tr + tr { border-top: 1px solid var(--line); }
    th:first-child { text-align: left; }
    tbody th { white-space: normal; }
    tbody td:first-of-type { font-weight: 700; }
    .metric-subtitle { display: block; margin-top: .1rem; color: var(--muted); font-size: .8125rem; font-weight: 400; line-height: 1.35; }
    .positive { color: var(--up); }
    .negative { color: var(--down); }
    .invalid { color: var(--warning); }
    .chart-control, .report-date { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .chart-control label, .report-date label { margin: 0; }
    .chart-control select, .report-date input {
      min-height: 2.75rem; max-width: 100%; padding: .45rem .65rem;
      border: 1px solid var(--line); border-radius: .55rem; color: var(--ink);
      font: inherit; font-size: .9rem; background: white;
    }
    .chart-control select { appearance: none; padding-inline-end: 2rem; }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: ""; position: absolute; inset-inline-end: .85rem; top: 42%;
      width: .42rem; height: .42rem; border: solid var(--muted); border-width: 0 2px 2px 0;
      transform: rotate(45deg); pointer-events: none;
    }
    .chart-axis { display: grid; grid-template-columns: minmax(7.5rem, 1fr) minmax(0, 4fr) minmax(6.5rem, 1fr); margin-top: 1rem; }
    .chart-ticks {
      grid-column: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
      gap: .3rem; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere;
    }
    .chart-ticks :last-child { text-align: right; }
    .chart-rows { list-style: none; margin: .4rem 0 0; padding: 0; }
    .chart-row {
      display: grid; grid-template-columns: minmax(7.5rem, 1fr) minmax(0, 4fr) minmax(6.5rem, 1fr);
      align-items: center; padding-block: .38rem; font-size: .9rem; font-variant-numeric: tabular-nums;
    }
    .chart-metric { grid-area: 1 / 1; padding-inline-end: .5rem; font-weight: 650; }
    .chart-value { grid-area: 1 / 3; padding-inline-start: .5rem; text-align: right; font-weight: 650; overflow-wrap: anywhere; }
    .chart-track { grid-area: 1 / 2; position: relative; height: 1.15rem; border-radius: .28rem; background: #edf2f8; }
    .chart-track::after { content: ""; position: absolute; inset-block: 0; left: 50%; border-left: 1px solid #7e90a7; }
    .chart-bar { position: absolute; inset-block: .13rem; border-radius: .18rem; }
    .chart-bar.positive { left: 50%; background: var(--up); }
    .chart-bar.negative { right: 50%; background: var(--down); }
    .chart-bar.zero {
      z-index: 1; left: 50%; top: 50%; width: .45rem; height: .45rem;
      transform: translate(-50%, -50%); border-radius: 50%; background: var(--muted);
    }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      .table-frame { overflow: visible; border: 0; }
      table, thead, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      tbody { display: grid; gap: .6rem; }
      tbody tr, tbody tr + tr { display: block; border: 1px solid var(--line); border-radius: .6rem; overflow: hidden; }
      tbody th { display: block; background: #eaf0f8; padding: .5rem .7rem; }
      tbody td { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .2rem .75rem; padding: .33rem .7rem; white-space: normal; overflow-wrap: anywhere; }
      tbody td:first-of-type { padding-top: .55rem; }
      tbody td:last-child { padding-bottom: .55rem; }
      .mobile-label { color: var(--muted); font-weight: 500; }
      .chart-axis, .chart-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .chart-ticks, .chart-track { grid-column: 1 / -1; }
      .chart-value { grid-column: 2; }
      .chart-track { grid-row: 2; margin-top: .28rem; }
    }
    @media (min-width: 701px) { .mobile-label { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>일일 채널 성과 증감 계산기</h1>
      <p>엑셀 표 한 번으로 5개 지표의 증감을 확인하세요.</p>
    </div>
  </header>
  <main class="wrap">
    <section aria-labelledby="input-title">
      <h2 id="input-title">엑셀 표 입력</h2>
      <p class="hint" id="input-hint">지표가 행에 있고 오늘, 전일, 전주 동기간, 전월 말, 전년 말이 열에 있는 표를 머리글과 함께 복사하세요.</p>
      <form id="calculator">
        <label for="source">붙여넣을 표</label>
        <textarea id="source" rows="6" aria-describedby="input-hint" spellcheck="false" wrap="off"></textarea>
        <div class="actions">
          <button type="submit" class="primary">증감 계산</button>
          <button type="button" id="load-example">가상 예시 불러오기</button>
        </div>
      </form>
      <p id="input-status" class="status" role="status"></p>
    </section>
    <section aria-labelledby="result-title">
      <div class="section-heading">
        <h2 id="result-title">증감 비교표</h2>
        <div class="result-actions">
          <div class="report-date">
            <label for="report-date">보고 기준일</label>
            <input type="date" id="report-date" required>
          </div>
          <button type="button" id="copy" disabled>결과 표 복사</button>
          <button type="button" id="copy-report" class="primary" disabled>보고 문장 복사</button>
        </div>
      </div>
      <p class="hint">증감은 오늘 수치에서 각 비교 기준 수치를 뺀 인원수입니다.</p>
      <div id="issues" class="notice" role="status" hidden></div>
      <p id="copy-status" class="status" role="status" hidden></p>
      <div id="manual-copy" hidden>
        <label for="copy-text" id="copy-label"></label>
        <textarea id="copy-text" rows="6" readonly></textarea>
      </div>
      <div class="table-frame" id="table-frame" hidden>
        <table aria-label="지표별 오늘 수치와 증감" role="table">
          <thead role="rowgroup"><tr id="headers" role="row"></tr></thead>
          <tbody id="rows" role="rowgroup"></tbody>
        </table>
      </div>
    </section>
    <section id="chart-section" aria-labelledby="chart-title" hidden>
      <div class="section-heading">
        <h2 id="chart-title">지표별 증감 그래프</h2>
        <div class="chart-control">
          <label for="chart-period">비교 기준</label>
          <div class="select-wrap"><select id="chart-period"></select></div>
        </div>
      </div>
      <p class="hint">0명을 기준으로 왼쪽은 감소, 오른쪽은 증가입니다.</p>
      <div class="chart-axis" aria-hidden="true">
        <div class="chart-ticks"><span id="chart-min"></span><span>0명</span><span id="chart-max"></span></div>
      </div>
      <ul id="chart-rows" class="chart-rows" aria-label="지표별 증감" role="list"></ul>
    </section>
  </main>
  <script>
    const metrics = [
      { name: 'MAU', subtitle: 'Monthly Active Users' },
      { name: 'YAU', subtitle: 'Yearly Active Users' },
      { name: 'DAU', subtitle: 'Daily Active Users' },
      { name: '하나원큐 전체 손님 수', previousNames: ['가입손님 수'] },
      { name: 'NEW 하나원큐 손님 수', previousNames: ['뉴앱 이용자 수', 'NEW 하나원큐 이용 손님 수'] }
    ];
    const previousMetricKeys = new Map(
      metrics.flatMap(({ name, previousNames = [] }) =>
        previousNames.map(previousName => [labelKey(previousName), labelKey(name)])
      )
    );
    const periods = ['오늘', '전일', '전주 동기간', '전월 말', '전년 말'];
    const inputHeaders = ['지표', ...periods];
    const resultHeaders = ['지표', '오늘', ...periods.slice(1).map(period => period + ' 대비')];
    const formatNumber = new Intl.NumberFormat('ko-KR');
    const example = [
      inputHeaders,
      ['MAU', '350,000', '348,000', '345,000', '352,000', '310,000'],
      ['YAU', '720,000', '720,000', '712,000', '702,000', '650,000'],
      ['DAU', '82,000', '82,500', '80,000', '79,000', '71,000'],
      ['하나원큐 전체 손님 수', '915,000', '914,000', '909,000', '902,000', '850,000'],
      ['NEW 하나원큐 손님 수', '145,000', '144,500', '143,000', '142,000', '104,000']
    ].map(row => row.join('\t')).join('\n');

    const form = document.querySelector('#calculator');
    const source = document.querySelector('#source');
    const inputStatus = document.querySelector('#input-status');
    const issues = document.querySelector('#issues');
    const tableFrame = document.querySelector('#table-frame');
    const headers = document.querySelector('#headers');
    const rows = document.querySelector('#rows');
    const reportDate = document.querySelector('#report-date');
    const copyButton = document.querySelector('#copy');
    const copyReportButton = document.querySelector('#copy-report');
    const copyStatus = document.querySelector('#copy-status');
    const manualCopy = document.querySelector('#manual-copy');
    const copyLabel = document.querySelector('#copy-label');
    const copyText = document.querySelector('#copy-text');
    const chartSection = document.querySelector('#chart-section');
    const chartPeriod = document.querySelector('#chart-period');
    const chartRows = document.querySelector('#chart-rows');
    const chartMin = document.querySelector('#chart-min');
    const chartMax = document.querySelector('#chart-max');
    let currentResult = null;
    let lastCopy = null;

    function cleanCell(value = '') {
      return value.trim().replace(/^"([^"]*)"$/, '$1').trim();
    }

    function labelKey(value) {
      return cleanCell(value).replace(/\s+/gu, '').toUpperCase();
    }

    function parseCount(cell) {
      const value = cleanCell(cell);
      if (!/^(?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)$/u.test(value)) return null;
      const count = Number(value.replaceAll(',', ''));
      return Number.isSafeInteger(count) ? count : null;
    }

    function calculate(text) {
      const lines = text.split(/\r\n|\n|\r/u).filter(line => line.trim() !== '');
      if (lines.length === 0) return { errors: ['엑셀 표를 붙여넣어 주세요.'] };

      const heading = lines[0].split('\t').map(labelKey);
      const columns = new Map();
      const errors = [];
      for (const label of inputHeaders) {
        const key = labelKey(label);
        const first = heading.indexOf(key);
        if (first === -1) errors.push('빠진 머리글 · ' + label);
        else if (first !== heading.lastIndexOf(key)) errors.push('중복 머리글 · ' + label);
        else columns.set(label, first);
      }
      if (errors.length > 0) return { errors };

      const inputRows = new Map();
      const duplicates = new Set();
      for (const line of lines.slice(1)) {
        const cells = line.split('\t');
        const inputKey = labelKey(cells[columns.get('지표')]);
        const key = previousMetricKeys.get(inputKey) ?? inputKey;
        if (inputRows.has(key)) duplicates.add(key);
        else inputRows.set(key, cells);
      }

      const warnings = [];
      const results = metrics.map(({ name: metric, subtitle }) => {
        const key = labelKey(metric);
        const cells = inputRows.get(key);
        if (!cells || duplicates.has(key)) {
          const reason = cells ? '지표가 중복되어 있어요.' : '지표 행이 빠졌어요.';
          warnings.push(metric + ' · ' + reason);
          return { metric, subtitle, values: periods.map(() => null) };
        }
        const counts = periods.map(period => {
          const count = parseCount(cells[columns.get(period)]);
          if (count === null) warnings.push(metric + ' · ' + period + ' 수치를 확인해 주세요.');
          return count;
        });
        const [today, ...baselines] = counts;
        const differences = baselines.map(count => today === null || count === null ? null : today - count);
        return { metric, subtitle, values: [today, ...differences] };
      });
      return { results, warnings };
    }

    function displayCount(count, isDifference) {
      if (count === null) return '확인 필요';
      const sign = isDifference && count > 0 ? '+' : '';
      return sign + formatNumber.format(count) + '명';
    }

    function formatReport(reportRows) {
      return reportRows.map(([metric, today, ...differences]) => {
        const comparisons = differences.map((value, index) => resultHeaders[index + 2] + ' ' + value);
        return metric + ' ' + today + ' (' + comparisons.join(', ') + ').';
      }).join('\n');
    }

    function todayInSeoul(date = new Date()) {
      const parts = new Intl.DateTimeFormat('en', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date);
      const fields = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
      return fields.year + '-' + fields.month + '-' + fields.day;
    }

    function renderMetricLabel(element, metric, subtitle) {
      element.textContent = metric;
      if (!subtitle) return;
      const description = document.createElement('span');
      description.className = 'metric-subtitle';
      description.lang = 'en';
      description.textContent = subtitle;
      element.append(description);
    }

    function renderChart(results) {
      const periodIndex = Number(chartPeriod.value);
      const values = results.map(row => row.values[periodIndex]);
      const limit = Math.max(0, ...values.map(value => Math.abs(value ?? 0)));
      chartMin.textContent = limit ? displayCount(-limit, true) : '';
      chartMax.textContent = limit ? displayCount(limit, true) : '';
      chartRows.setAttribute('aria-label', resultHeaders[periodIndex + 1] + ' 지표별 증감');
      chartRows.replaceChildren();

      for (const [index, { metric }] of results.entries()) {
        const value = values[index];
        const row = document.createElement('li');
        row.className = 'chart-row';
        const label = document.createElement('span');
        label.className = 'chart-metric';
        label.textContent = metric;
        const track = document.createElement('span');
        track.className = 'chart-track';
        track.setAttribute('aria-hidden', 'true');
        const amount = document.createElement('span');
        amount.className = 'chart-value';
        amount.textContent = displayCount(value, true);

        if (value === null) {
          amount.classList.add('invalid');
        } else {
          const direction = value > 0 ? 'positive' : value < 0 ? 'negative' : 'zero';
          const bar = document.createElement('span');
          bar.classList.add('chart-bar', direction);
          amount.classList.add(direction);
          if (value !== 0) bar.style.width = (Math.abs(value) / limit * 50) + '%';
          track.append(bar);
        }
        row.append(label, amount, track);
        chartRows.append(row);
      }
      chartSection.hidden = false;
    }

    function showIssues(messages) {
      issues.hidden = messages.length === 0;
      const list = document.createElement('ul');
      for (const message of messages) {
        const item = document.createElement('li');
        item.textContent = message;
        list.append(item);
      }
      issues.replaceChildren('입력한 표를 확인해 주세요.', list);
    }

    function clearCopyFeedback() {
      lastCopy = null;
      copyStatus.hidden = true;
      manualCopy.hidden = true;
      copyText.value = '';
    }

    function clearResults() {
      currentResult = null;
      clearCopyFeedback();
      tableFrame.hidden = true;
      chartSection.hidden = true;
      copyButton.disabled = true;
      copyReportButton.disabled = true;
      rows.replaceChildren();
      chartRows.replaceChildren();
      showIssues([]);
    }

    function renderResults() {
      clearResults();
      const { errors, results, warnings } = calculate(source.value);
      if (errors) {
        showIssues(errors);
        inputStatus.textContent = '입력 표를 확인한 뒤 다시 계산해 주세요.';
        return;
      }

      const reportRows = [];
      for (const { metric, subtitle, values } of results) {
        const row = document.createElement('tr');
        row.setAttribute('role', 'row');
        const heading = document.createElement('th');
        heading.scope = 'row';
        heading.setAttribute('role', 'rowheader');
        renderMetricLabel(heading, metric, subtitle);
        row.append(heading);
        const reportRow = [metric];
        for (const [index, count] of values.entries()) {
          const isDifference = index > 0;
          const value = displayCount(count, isDifference);
          const cell = document.createElement('td');
          cell.setAttribute('role', 'cell');
          if (count === null) cell.classList.add('invalid');
          else if (isDifference && count > 0) cell.classList.add('positive');
          else if (isDifference && count < 0) cell.classList.add('negative');
          const label = document.createElement('span');
          label.className = 'mobile-label';
          label.setAttribute('aria-hidden', 'true');
          label.textContent = resultHeaders[index + 1];
          const amount = document.createElement('span');
          amount.textContent = value;
          cell.append(label, amount);
          row.append(cell);
          reportRow.push(value);
        }
        rows.append(row);
        reportRows.push(reportRow);
      }
      currentResult = {
        results,
        table: [resultHeaders, ...reportRows].map(row => row.join('\t')).join('\n'),
        report: formatReport(reportRows)
      };
      showIssues(warnings);
      tableFrame.hidden = false;
      copyButton.disabled = false;
      copyReportButton.disabled = false;
      renderChart(results);
      const validComparisons = results.flatMap(({ values }) => values.slice(1)).filter(value => value !== null).length;
      inputStatus.textContent = '비교 20개 중 ' + validComparisons + '개를 계산했어요.';
    }

    function loadExample() {
      source.value = example;
      renderResults();
      inputStatus.textContent = '가상 예시로 비교 20개를 계산했어요.';
    }

    for (const label of resultHeaders) {
      const heading = document.createElement('th');
      heading.scope = 'col';
      heading.setAttribute('role', 'columnheader');
      heading.textContent = label;
      headers.append(heading);
    }
    for (const [offset, period] of periods.slice(1).entries()) {
      chartPeriod.add(new Option(period + ' 대비', String(offset + 1)));
    }
    chartPeriod.addEventListener('change', () => {
      if (currentResult) renderChart(currentResult.results);
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      renderResults();
    });
    source.addEventListener('input', () => {
      clearResults();
      inputStatus.textContent = '입력한 표의 증감을 계산하려면 ‘증감 계산’을 누르세요.';
    });
    document.querySelector('#load-example').addEventListener('click', loadExample);
    reportDate.addEventListener('input', () => {
      if (lastCopy?.key === 'report') clearCopyFeedback();
    });
    async function copyResult(key, label) {
      if (!currentResult) return;
      if (key === 'report' && !reportDate.reportValidity()) return;
      const text = key === 'report' ? '보고 기준일 ' + reportDate.value + '\n' + currentResult.report : currentResult.table;
      const request = { key };
      lastCopy = request;
      try {
        await navigator.clipboard.writeText(text);
        if (lastCopy !== request) return;
        manualCopy.hidden = true;
        copyStatus.textContent = label + ' 복사 완료';
      } catch {
        if (lastCopy !== request) return;
        manualCopy.hidden = false;
        copyLabel.textContent = '복사할 ' + label;
        copyText.value = text;
        copyText.wrap = key === 'table' ? 'off' : 'soft';
        copyText.focus();
        copyText.select();
        copyStatus.textContent = '선택한 내용을 복사하세요. Mac은 ⌘C, Windows는 Ctrl+C를 누르세요.';
      }
      copyStatus.hidden = false;
    }
    copyButton.addEventListener('click', () => copyResult('table', '결과 표'));
    copyReportButton.addEventListener('click', () => copyResult('report', '보고 문장'));
    reportDate.value = todayInSeoul();
    loadExample();
  </script>
</body>
</html>
