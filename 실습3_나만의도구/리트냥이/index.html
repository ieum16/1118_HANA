* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #1e2953, transparent 55%); }
main { width: min(1200px, 100%); margin: auto; padding: clamp(1rem, 3.5vw, 2.65rem); }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; overflow-wrap: anywhere; }
h1 { font-size: clamp(2.05rem, 5vw, 3.65rem); letter-spacing: -.08em; line-height: 1.12; }
h2 { font-size: 1.24rem; letter-spacing: -.03em; }
h3 { font-size: 1rem; }
header {
  background-color: #20285b;
  background-image: linear-gradient(90deg, #10183a 3%, #151d49c9 49%, #131a4530 100%), var(--hero-art);
  background-size: cover;
  background-position: center, center 49%;
  border: 1px solid #55629c;
  border-radius: 1.15rem;
  padding: clamp(1.25rem, 4vw, 2.6rem);
  min-height: clamp(14.5rem, 25vw, 18rem);
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 1.1rem;
  flex-wrap: wrap;
}
.brand-mark {
  display: block;
  width: 3.15rem;
  height: 3.15rem;
  margin-bottom: .85rem;
  background: var(--brand-art) center / contain no-repeat;
}
header p { color: #e1e6ff; margin-top: .6rem; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; font-weight: 800; min-height: 2.8rem; }
.primary { border: 1px solid #e4e9ff; border-radius: 99px; background: #e3e9ff; color: #132353; padding: .58rem 1rem; }
.primary:hover { background: white; }
:focus-visible { outline: 3px solid #b7cdff; outline-offset: 3px; }
.layout { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.35fr); gap: 1rem; margin-top: 1.1rem; align-items: start; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; padding: clamp(1rem, 2.4vw, 1.5rem); }
.panel-head { display: flex; justify-content: space-between; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem; }
.heading-icon { display: inline-flex; align-items: center; gap: .55rem; }
.icon { display: inline-grid; place-items: center; flex: none; width: 1.25rem; height: 1.25rem; font-weight: 800; line-height: 1; }
.heading-icon .icon { color: var(--accent); }
.icon-mail { position: relative; width: 1rem; height: .76rem; border: 2px solid currentColor; border-radius: .18rem; }
.icon-mail::after { content: ""; width: .39rem; height: .39rem; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-.17rem) rotate(45deg); }
.muted, .count, .foot { color: var(--muted); font-size: .875rem; }
.inbox { list-style: none; padding: 0; display: grid; gap: .54rem; }
.message { display: grid; width: 100%; text-align: left; gap: .37rem; border: 1px solid var(--line); background: var(--surface); border-radius: .67rem; padding: .74rem; min-width: 0; }
.message:hover, .choice:hover, .secondary:hover { border-color: var(--accent); }
.message[aria-pressed=true] { border-color: #8397e1; background: var(--selected); box-shadow: inset 3px 0 #aab9ff; }
.message-top, .identity-line, .message-foot { display: flex; align-items: center; justify-content: space-between; gap: .55rem; min-width: 0; }
.identity-line { justify-content: start; }
.person { display: grid; gap: .05rem; min-width: 0; }
.person strong { font-size: .96rem; }
.avatar { flex: none; display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: .62rem; background: #354465; color: #f1f2ff; font-size: .77rem; font-weight: 850; }
.avatar.slack { background: #693c69; }
.avatar.discord { background: #46538f; }
.avatar.kakao { background: #655522; color: #fff0a4; }
.source { display: inline-flex; flex: none; align-items: center; gap: .23rem; width: max-content; color: #e6ecff; background: #354465; border-radius: .3rem; padding: .06rem .38rem; font-size: .8rem; font-weight: 750; }
.source.slack { background: #553551; color: #ffdcf3; }
.source.discord { background: #333e78; color: #e0e3ff; }
.source.kakao { color: #261d00; background: #f8dc75; }
.message-summary { font-weight: 700; font-size: .93rem; overflow-wrap: anywhere; }
.message-meta, .received { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.received { flex: none; font-variant-numeric: tabular-nums; }
.message-foot { flex-wrap: wrap; }
.priority { color: #dce3ff; background: #303b5d; border-radius: .28rem; padding: .04rem .35rem; font-size: .8rem; font-weight: 700; }
.priority.urgent { color: #ffd7df; background: #66364c; }
.priority.today { color: #f6e6ab; background: #54452c; }
details { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: .65rem; }
summary { cursor: pointer; font-weight: 750; }
form { display: grid; gap: .65rem; margin-top: .65rem; }
.inputs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .6rem; }
.field { display: grid; gap: .25rem; min-width: 0; }
label { font-weight: 700; font-size: .9rem; }
select, input, textarea { width: 100%; border: 1px solid #525e88; border-radius: .45rem; background: var(--surface); padding: .5rem; min-width: 0; }
textarea { resize: vertical; }
.secondary { padding: .44rem .75rem; border: 1px solid #6675a4; border-radius: .58rem; background: #29355a; color: #ebefff; }
.detail-sender { background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; padding: .65rem .75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .55rem; }
.sender-context { color: var(--muted); font-size: .84rem; margin-top: .4rem; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border-block: 1px solid var(--line); margin: .8rem 0; padding-block: .6rem; gap: .6rem; }
dt { color: var(--muted); font-size: .84rem; }
dd { font-weight: 800; font-size: .95rem; }
blockquote { white-space: pre-wrap; overflow-wrap: anywhere; margin: .45rem 0 .9rem; padding: .65rem .75rem; border-left: 3px solid #8397e1; background: var(--surface); }
.analysis { padding: .68rem .78rem; background: #23305a; border: 1px solid #485a93; border-radius: .55rem; margin-bottom: .95rem; }
.analysis p+p { margin-top: .25rem; }
.choices { display: grid; gap: .45rem; margin-top: .48rem; }
.choice { display: grid; grid-template-columns: 1rem 1fr; text-align: left; column-gap: .55rem; row-gap: .15rem; background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; padding: .57rem .7rem; }
.choice::before { content: ""; grid-row: span 2; border: 1px solid var(--accent); border-radius: 50%; width: .77rem; height: .77rem; align-self: center; }
.choice[aria-pressed=true] { border-color: #869be9; background: var(--selected); }
.choice[aria-pressed=true]::before { background: var(--accent); box-shadow: inset 0 0 0 2px var(--selected); }
.choice span { font-size: .87rem; color: var(--muted); }
.decision { margin-top: .65rem; color: #cfdbff; min-height: 1.5em; }
footer { margin-top: 1rem; }
@media (max-width: 730px) { .layout { grid-template-columns: 1fr; } header { background-position: center, 62% center; } }
@media (max-width: 390px) { .facts { grid-template-columns: repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
<main>
<header>
  <div><span class="brand-mark" aria-hidden="true"></span><h1>업무 인박스</h1><p>흩어진 메시지에서 요청과 마감, 다음 행동을 확인하세요.</p></div>
  <button class="primary" type="button" id="receive"><span class="icon" aria-hidden="true">＋</span>가상 메시지 수신</button>
</header>
<div class="layout">
<section class="panel" aria-labelledby="inbox-title">
<div class="panel-head"><h2 id="inbox-title" class="heading-icon"><span class="icon icon-mail" aria-hidden="true"></span>수신함</h2><span class="count" id="count"></span></div>
<ul class="inbox" id="inbox"></ul>
<details>
  <summary>가상 메시지 직접 입력</summary>
  <form id="compose">
    <div class="inputs">
      <div class="field"><label for="channel">플랫폼</label><select id="channel"><option value="slack">Slack</option><option value="discord">Discord</option><option value="kakao">카카오톡</option></select></div>
      <div class="field"><label for="sender">가상 발신자</label><input id="sender" maxlength="36" placeholder="예시 담당자" autocomplete="off"></div>
      <div class="field"><label for="org">회사 또는 조직</label><input id="org" maxlength="44" placeholder="예시 회사" autocomplete="off"></div>
      <div class="field"><label for="team">소속 팀</label><input id="team" maxlength="44" placeholder="예시 운영팀" autocomplete="off"></div>
      <div class="field"><label for="role">역할</label><input id="role" maxlength="36" placeholder="예시 담당자" autocomplete="off"></div>
      <div class="field"><label for="place">채널 또는 대화방</label><input id="place" maxlength="60" placeholder="#가상-프로젝트" autocomplete="off"></div>
    </div>
    <div class="field"><label for="body">메시지</label><textarea id="body" rows="3" maxlength="800" required placeholder="예: 내일 오후 2시까지 회의 자료를 검토해 주세요."></textarea></div>
    <button class="secondary" type="submit">분석에 추가</button>
  </form>
</details>
<p class="foot" id="arrival" role="status"></p>
</section>
<section class="panel" aria-labelledby="analysis-title">
<div class="panel-head"><h2 id="analysis-title" class="heading-icon"><span class="icon" aria-hidden="true">✦</span>메시지 분석</h2><span id="from" class="source"></span></div>
<div class="detail-sender">
  <div class="identity-line"><span id="detail-avatar" class="avatar" aria-hidden="true"></span><div class="person"><strong id="detail-name"></strong><span class="message-meta" id="detail-org"></span></div></div>
  <span class="received" id="detail-time"></span>
</div>
<p class="sender-context" id="detail-context"></p>
<dl class="facts"><div><dt>업무 유형</dt><dd id="type"></dd></div><div><dt>우선순위</dt><dd id="priority"></dd></div><div><dt>기한 표현</dt><dd id="due"></dd></div></dl>
<h3>원문</h3><blockquote id="original"></blockquote>
<div class="analysis"><h3>확인할 내용</h3><p id="summary"></p><p class="muted" id="reason"></p></div>
<h3>다음 행동 선택</h3><div class="choices" id="choices"></div><p class="decision" id="decision" role="status"></p>
</section>
</div>
<footer class="foot" id="slack-state">실습용 수신 시뮬레이션 · 입력한 메시지는 이 페이지에서만 분석합니다.</footer>
</main>
<script>
const byId = id => document.getElementById(id);
const channels = {slack:"Slack", discord:"Discord", kakao:"카카오톡"};
const marks = {slack:"#", discord:"◈", kakao:"●"};
const samples = [
  {source:"slack",sender:"서하린",org:"가상 모아웍스",team:"브랜드디자인팀",role:"프로젝트 리드",place:"#브랜드-리뉴얼",time:"09:42",text:"오늘 오후 4시까지 발표 자료 초안을 검토해 주세요. 표지 문구와 오탈자를 먼저 확인 부탁드립니다."},
  {source:"discord",sender:"윤라온",org:"가상 모아웍스",team:"서비스 QA팀",role:"테스트 담당",place:"#프로젝트-테스트",time:"09:24",text:"긴급: 시험용 신청 페이지에서 저장 버튼 오류가 발생했어요. 가능한 빨리 재현 여부를 확인해 주세요."},
  {source:"kakao",sender:"한마루",org:"가상 파랑스튜디오",team:"파트너 운영팀",role:"외부 협업 담당",place:"협업 일정 단체방",time:"09:10",text:"내일 오후 2시 회의 시간을 3시로 변경할 수 있을까요? 가능한 시간 알려주세요."},
  {source:"slack",sender:"이봄결",org:"가상 모아웍스",team:"사업운영팀",role:"운영 담당",place:"#팀-공지",text:"공유드립니다. 다음 회의 안건은 팀 폴더에 올려 두었습니다. 참고만 해 주세요."},
  {source:"discord",sender:"서하린",org:"가상 모아웍스",team:"브랜드디자인팀",role:"프로젝트 리드",place:"#발표-준비",text:"금요일까지 발표 초안 파일을 보내 주세요. 링크 공유도 가능합니다."},
];
const rules = [
  {name:"오류 확인",pattern:/오류|작동하지|장애|실패|버그/},
  {name:"일정 조율",pattern:/회의 시간|일정.{0,6}(변경|조율)|가능한 시간|미팅|시간을.{0,15}(변경|미루)/},
  {name:"자료 검토",pattern:/검토|오탈자|피드백|확인 부탁/},
  {name:"자료 전달",pattern:/보내\s*주|전달\s*해|공유\s*해|제출|첨부/},
];
const actions = {
  "오류 확인":[["재현부터 확인","가상 화면에서 문제를 재현하고 조건을 기록합니다."],["발생 조건 질문","어느 화면에서 어떤 동작 뒤 문제가 생겼는지 물어봅니다."]],
  "일정 조율":[["가능한 시간 제안","내 일정에서 가능한 시간을 확인한 뒤 대안을 정합니다."],["변경 요청 확인","참석자와 확정 시각을 먼저 확인합니다."]],
  "자료 검토":[["검토 시작","원문에 나온 확인 항목부터 살펴보고 의견을 정리합니다."],["자료 위치 확인","파일이나 링크가 준비됐는지 먼저 확인합니다."]],
  "자료 전달":[["자료 준비","대상 파일과 기한을 확인하고 공유할 자료를 준비합니다."],["전달 범위 확인","어떤 파일과 형식이 필요한지 확인합니다."]],
  "참고 공유":[["참고로 남기기","즉시 할 일이 없는 공유 사항으로 분류합니다."],["후속 요청 확인","내가 처리해야 할 일이 있는지 확인합니다."]],
  "요청 확인":[["요청 내용 묻기","필요한 결과물과 처리 기한을 짧게 확인합니다."],["나중에 검토","지금 아는 내용만 기록하고 추가 정보를 기다립니다."]],
};
let sequence = 0;
let nextSample = 3;
let selected = 0;
const messages = [];
const decisions = new Map();

function analyze(text) {
  const urgent = /긴급|즉시|ASAP|가능한\s*빨리/i.test(text);
  const duePhrase = text.match(/(?:(?:오늘|내일|모레|[월화수목금토일]요일|이번\s*주|다음\s*주|\d{1,2}월\s*\d{1,2}일)\s*)?(?:(?:오전|오후)\s*)?\d{1,2}(?::\d{2}|시(?:\s*\d{1,2}분)?)\s*(?:까지|전|에|회의)?|(?:오늘|내일|모레|[월화수목금토일]요일|이번\s*주|다음\s*주|\d{1,2}월\s*\d{1,2}일)\s*까지/);
  const due = duePhrase?.[0].trim() || "명시 없음";
  const sentences = text.match(/[^.!?\n]+[.!?]?/g) || [text];
  const request = sentences.find(line => /주세요|부탁|가능할까요|있을까요|필요|바랍니다|해\s*줘/.test(line));
  const rule = rules.find(item => item.pattern.test(text));
  const informational = /참고만|참고용/.test(text) || (!request && /^\s*(?:공지|공유드립니다|참고)/.test(text));
  const type = informational ? "참고 공유" : (rule?.name || "요청 확인");
  const todayDeadline = /^오늘/.test(due) && !informational;
  const priority = informational ? "참고" : (urgent ? "긴급" : todayDeadline ? "오늘 처리" : "확인 필요");
  const reason = informational ? "참고로 공유한다는 표현을 발견했어요." :
    urgent ? "긴급하거나 빠른 처리를 요청하는 표현을 발견했어요." :
    duePhrase ? "원문에서 시간 표현을 추출했어요. 확정 기한은 원문을 확인하세요." :
    "구체적인 기한 표현이 없어요.";
  const context = sentences[0].trim();
  const requestLine = request?.trim();
  const summary = requestLine && requestLine !== context ? context + " " + requestLine : context;
  return {type, due, priority, summary, reason};
}

function make(tag, label, className) {
  const node = document.createElement(tag);
  node.textContent = label;
  if (className) node.className = className;
  return node;
}

function initial(name) {
  return Array.from(name.replace(/\s/g, "")).slice(0, 2).join("");
}

function channelBadge(source) {
  const marker = make("span", marks[source]);
  marker.setAttribute("aria-hidden", "true");
  return [marker, document.createTextNode(channels[source])];
}

function addMessage(data) {
  const time = data.time || new Intl.DateTimeFormat("ko-KR", {hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).format(new Date());
  const message = {...data, time, id:++sequence, analysis:analyze(data.text)};
  messages.unshift(message);
  return message;
}

function openMessage(id) {
  selected = id;
  const msg = messages.find(message => message.id === id);
  for (const button of byId("inbox").querySelectorAll("button")) button.setAttribute("aria-pressed", String(Number(button.dataset.id) === id));
  for (const key of ["type","priority","due","summary","reason"]) byId(key).textContent = msg.analysis[key];
  byId("from").className = "source " + msg.source;
  byId("from").replaceChildren(...channelBadge(msg.source));
  byId("detail-avatar").className = "avatar " + msg.source;
  byId("detail-avatar").textContent = initial(msg.sender);
  byId("detail-name").textContent = msg.sender;
  byId("detail-org").textContent = msg.org + " · " + msg.team;
  byId("detail-time").textContent = msg.time;
  byId("detail-context").textContent = msg.role + " · " + msg.place;
  byId("original").textContent = msg.text;
  const options = actions[msg.analysis.type];
  const choiceButtons = options.map(([label,description], index) => {
    const button = make("button","","choice");
    button.type = "button";
    button.setAttribute("aria-pressed", String(decisions.get(id) === index));
    button.append(make("strong",label),make("span",description));
    button.addEventListener("click", () => {
      decisions.set(id,index);
      for (const [i, option] of choiceButtons.entries()) option.setAttribute("aria-pressed", String(i === index));
      byId("decision").textContent = "선택한 업무 · " + label;
    });
    return button;
  });
  byId("choices").replaceChildren(...choiceButtons);
  const decision = decisions.get(id);
  byId("decision").textContent = decision === undefined ? "" : "선택한 업무 · " + options[decision][0];
}

function renderInbox() {
  byId("count").textContent = messages.length + "건";
  byId("inbox").replaceChildren(...messages.map(msg => {
    const listItem = document.createElement("li");
    const button = make("button","","message");
    button.type = "button";
    button.dataset.id = msg.id;
    button.setAttribute("aria-pressed", String(msg.id === selected));
    const top = make("span","","message-top");
    const identity = make("span","","identity-line");
    const avatar = make("span",initial(msg.sender),"avatar "+msg.source);
    avatar.setAttribute("aria-hidden","true");
    const person = make("span","","person");
    person.append(make("strong",msg.sender), make("span",msg.org+" · "+msg.team,"message-meta"));
    identity.append(avatar,person);
    top.append(identity, make("span",msg.time,"received"));
    const channel = make("span","","source "+msg.source);
    channel.append(...channelBadge(msg.source));
    const foot = make("span","","message-foot");
    const priorityStyle = {"긴급":" urgent","오늘 처리":" today"}[msg.analysis.priority] || "";
    foot.append(channel, make("span",msg.place,"message-meta"), make("span",msg.analysis.priority,"priority"+priorityStyle));
    button.append(top, make("span",msg.analysis.summary.length > 72 ? msg.analysis.summary.slice(0,72)+"…" : msg.analysis.summary,"message-summary"), foot);
    button.addEventListener("click", () => openMessage(msg.id));
    listItem.append(button);
    return listItem;
  }));
}

function receive(data) {
  const message = addMessage(data);
  renderInbox();
  openMessage(message.id);
  byId("arrival").textContent = channels[message.source] + " 가상 메시지 1건을 분석했어요.";
}

samples.slice(0,3).reverse().forEach(addMessage);
renderInbox();
openMessage(messages[0].id);
byId("receive").addEventListener("click", () => {
  receive(samples[nextSample]);
  nextSample = (nextSample + 1) % samples.length;
});
byId("compose").addEventListener("submit", event => {
  event.preventDefault();
  const field = byId("body");
  const text = field.value.trim();
  if (!text) {
    byId("arrival").textContent = "가상 메시지 내용을 입력하세요.";
    field.focus();
    return;
  }
  const details = {sender:"미입력 발신자", org:"조직 미입력", team:"팀 미입력", role:"역할 미입력", place:"직접 입력"};
  const senderDetails = Object.fromEntries(Object.entries(details).map(([id,fallback]) => [id,byId(id).value.trim() || fallback]));
  receive({source:byId("channel").value,...senderDetails,text});
  event.currentTarget.reset();
});

</script>
</body>
</html>
